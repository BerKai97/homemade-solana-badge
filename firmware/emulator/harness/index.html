<!doctype html>
<!--
  Local page for the Solana OS browser emulator (emulator/out/solana-os.{js,wasm}).
  The official page lives in Solana's private site repo; this one only does what the
  firmware's page API (emulator/README.md) needs: draw the framebuffer, feed the
  buttons, run console lines, show stdout.

  Serve the emulator folder and open /harness/:
    python3 -m http.server -d emulator 8000   ->  http://localhost:8000/harness/
  Keys: arrows, Enter = select, Esc/Backspace = back, H = home (BOOT). While a text
  field is open on the badge, typing and Ctrl+V go into it (Enter = OK, Esc = cancel).
  ?server=https://...  points the badge at a badge server (none by default: offline).
  ?badge=2             a second badge with its own MAC and NVS.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solana OS Emulator</title>
<style>
  :root { color-scheme: dark; --bg: #111; --fg: #ddd; --dim: #888; --line: #333; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 ui-monospace, monospace; }
  main { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  canvas { width: 640px; max-width: 100%; image-rendering: pixelated; border: 1px solid var(--line); background: #000; }
  #side { flex: 1; min-width: 320px; display: flex; flex-direction: column; gap: 8px; }
  #log { flex: 1; min-height: 360px; max-height: 70vh; overflow: auto; white-space: pre-wrap; border: 1px solid var(--line); padding: 8px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; background: #000; color: var(--fg); border: 1px solid var(--line); padding: 6px; font: inherit; }
  .pad { display: grid; grid-template-columns: repeat(4, 64px); gap: 6px; }
  button { background: #222; color: var(--fg); border: 1px solid var(--line); padding: 8px 0; font: inherit; cursor: pointer; }
  #leds { display: flex; gap: 6px; } #leds span { width: 16px; height: 16px; border-radius: 50%; background: #000; border: 1px solid var(--line); }
  small { color: var(--dim); }
</style>
</head>
<body>
<main>
  <div>
    <canvas id="screen" width="320" height="240"></canvas>
    <div id="leds"></div>
    <div class="pad">
      <span></span><button data-key="up">Up</button><span></span><button data-key="home">Home</button>
      <button data-key="left">Left</button><button data-key="select">OK</button><button data-key="right">Right</button><button data-key="back">Back</button>
      <span></span><button data-key="down">Down</button>
    </div>
    <small>Arrows, Enter = OK, Esc/Backspace = Back, H = Home. In a text field: type or Ctrl+V, Enter = OK</small>
  </div>
  <div id="side">
    <div id="log"></div>
    <form id="cmd"><input id="line" placeholder="console: help, info, apps, open <id>, wifi ..." autocomplete="off"><button>Run</button></form>
  </div>
</main>
<script src="../out/solana-os.js"></script>
<script>
const BITS = { up: 1 << 0, left: 1 << 1, right: 1 << 2, down: 1 << 3, select: 1 << 4, back: 1 << 5, home: 1 << 6 };
const KEYS = { ArrowUp: 'up', ArrowLeft: 'left', ArrowRight: 'right', ArrowDown: 'down', Enter: 'select',
               Escape: 'back', Backspace: 'back', h: 'home', H: 'home' };
const params = new URLSearchParams(location.search);
const logEl = document.getElementById('log');
const log = (s) => { logEl.textContent += s + '\n'; logEl.scrollTop = logEl.scrollHeight; };
window.badgeLog = () => logEl.textContent;

const ctx = document.getElementById('screen').getContext('2d');
const img = ctx.createImageData(320, 240);
const ledEls = Array.from({ length: 8 }, () => document.getElementById('leds').appendChild(document.createElement('span')));
let mod, held = 0, lastFrame = -1, lastLeds = -1;

function boot(resetReason) {
  SolanaOS({
    print: log, printErr: log,
    locateFile: (p) => '../out/' + p,
  }).then((m) => {
    mod = m;
    window.badge = m;
    if (params.get('server')) m.server = params.get('server');
    m.resetReason = resetReason;
    m.onRestart = () => location.reload();
    requestAnimationFrame(draw);
  });
}

function draw() {
  const frame = mod._emu_frame();
  if (frame !== lastFrame) {
    lastFrame = frame;
    const ptr = mod._emu_framebuffer();
    img.data.set(mod.HEAPU8.subarray(ptr, ptr + 320 * 240 * 4));
    ctx.putImageData(img, 0, 0);
  }
  const lv = mod._emu_leds_version();
  if (lv !== lastLeds) {
    lastLeds = lv;
    const p = mod._emu_leds() >> 2;
    ledEls.forEach((el, i) => { const c = mod.HEAPU32[p + i]; el.style.background = '#' + (c & 0xffffff).toString(16).padStart(6, '0'); });
  }
  requestAnimationFrame(draw);
}

function setKey(name, down) {
  if (!mod || !(name in BITS)) return;
  held = down ? held | BITS[name] : held & ~BITS[name];
  mod._emu_buttons_set(held);
}
window.press = (name, ms = 120) => new Promise((r) => { setKey(name, true); setTimeout(() => { setKey(name, false); setTimeout(r, 150); }, ms); });
window.consoleRun = (line) => mod && mod.ccall('emu_console', null, ['string'], [line]);
// Lines from tools/badge_put.py --out harness/apps/<id>.txt: the same `lua put`
// the badge's serial console takes.
window.installApp = async (id) => {
  const text = await (await fetch('apps/' + id + '.txt', { cache: 'no-store' })).text();
  consoleRun('open home');
  for (const line of text.split('\n')) if (line.trim()) consoleRun(line);
  log('installed ' + id + ': lua run ' + id);
};
if (params.get('install')) setTimeout(() => installApp(params.get('install')), 1500);

// While a text field is open on the badge, the PC keyboard types into it (the
// console's kb command): letters type, Backspace erases, Enter presses OK, Esc
// cancels, the arrows still move. Ctrl+V pastes.
const kbOpen = () => mod && mod._emu_kb_open && mod._emu_kb_open();
const hex = (t) => Array.from(new TextEncoder().encode(t), (b) => b.toString(16).padStart(2, '0')).join('');
window.typeText = (t) => {
  t = t.replace(/\s+/g, ' ').replace(/[^\x20-\x7e]/g, '');
  for (let i = 0; i < t.length; i += 40) consoleRun('kb hex ' + hex(t.slice(i, i + 40)));
};
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (kbOpen() && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const kb = { Backspace: 'kb del', Enter: 'kb ok', Escape: 'kb cancel' }[e.key];
    if (kb || e.key.length === 1) {
      e.preventDefault();
      if (kb) consoleRun(kb); else typeText(e.key);
      return;
    }
  }
  if (KEYS[e.key]) { e.preventDefault(); if (!e.repeat) setKey(KEYS[e.key], true); }
});
addEventListener('paste', (e) => {
  if (e.target.tagName === 'INPUT' || !kbOpen()) return;
  e.preventDefault();
  typeText(e.clipboardData.getData('text'));
});
addEventListener('keyup', (e) => { if (KEYS[e.key]) setKey(KEYS[e.key], false); });
document.querySelectorAll('[data-key]').forEach((b) => {
  b.addEventListener('pointerdown', () => setKey(b.dataset.key, true));
  b.addEventListener('pointerup', () => setKey(b.dataset.key, false));
  b.addEventListener('pointerleave', () => setKey(b.dataset.key, false));
});
document.getElementById('cmd').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = document.getElementById('line');
  log('> ' + input.value);
  consoleRun(input.value);
  input.value = '';
});

boot('poweron');
</script>
</body>
</html>
